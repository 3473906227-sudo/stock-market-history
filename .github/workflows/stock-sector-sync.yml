name: A-share industry boards sync

on:
  # 修复当天GitHub schedule漏触发的兜底：大盘任务成功后只检查行业缺数，未齐才补采。
  # 一个交易日已完整更新时，闸门不再下载任何行情。
  workflow_run:
    workflows: ['Daily A-share market indices sync']
    types: [completed]
    branches: [main]
  # 只由该一次性修复标记文件触发；平时提交代码不触发行情。
  push:
    paths:
      - tools/run_sector_restore_20261126.flag
  workflow_dispatch:
    inputs:
      quotes_only:
        description: 'Only update closing quote snapshots'
        type: boolean
        default: false
      force:
        description: 'Recheck an already complete trading day'
        type: boolean
        default: false
  schedule:
    # 北京时间17:05。交易所休市日由前置检查过滤。
    - cron: '5 9 * * 1-5'
  pull_request:
    paths:
      - sector_sync.py
      - tools/*sector*.py
      - tools/github_schedule_trigger.py
      - .github/workflows/stock-sector-sync.yml

permissions:
  contents: read

concurrency:
  group: a-share-industry-boards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Test industry source validation and publishing
        run: python -m unittest discover -s tools -p 'test_*sector*.py' -v

  daily_gate:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_needed: ${{ steps.gate.outputs.run_needed }}
      expected_trade_day: ${{ steps.gate.outputs.expected_trade_day }}
      fetch_quotes: ${{ steps.gate.outputs.fetch_quotes }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
            data/sectors
      - name: Check A-share exchange calendar
        id: calendar
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        run: python tools/github_schedule_trigger.py --check-trading-day
      - name: Check verified coverage for the latest closed session
        id: gate
        if: (github.event_name != 'schedule' && github.event_name != 'workflow_run') || steps.calendar.outputs.trading_day == 'true'
        env:
          SECTOR_FORCE_UPDATE: ${{ inputs.force || 'false' }}
          SECTOR_QUOTES_ONLY: ${{ inputs.quotes_only || 'false' }}
        run: python -m tools.sector_daily_gate
      - name: Plan only the shards with missing trading days
        id: plan
        if: steps.gate.outputs.run_needed == 'true' && !inputs.quotes_only
        env:
          TARGET: ${{ steps.gate.outputs.expected_trade_day }}
        run: |
          shards=$(python -m tools.sector_ohlcv plan --target "$TARGET" --shards 30)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  fetch_history:
    needs: daily_gate
    if: needs.daily_gate.outputs.run_needed == 'true' && needs.daily_gate.outputs.shards != '' && needs.daily_gate.outputs.shards != '[]'
    name: Industry daily bars shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.daily_gate.outputs.shards || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
            data/sectors
      - name: Fetch validated observations from Eastmoney
        env:
          TARGET: ${{ needs.daily_gate.outputs.expected_trade_day }}
          SHARD: ${{ matrix.shard }}
        run: python -m tools.sector_ohlcv fetch --target "$TARGET" --shard "$SHARD" --shards 30
      - uses: actions/upload-artifact@v4
        with:
          name: stock-sector-history-${{ matrix.shard }}
          path: sector_history/history-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  fetch_pages:
    name: Official BK quote page ${{ matrix.page }} attempt ${{ matrix.attempt }}
    needs: daily_gate
    if: needs.daily_gate.outputs.fetch_quotes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        page: [1, 2, 3, 4, 5]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Stagger requests across independent hosted runners
        env:
          PAGE: ${{ matrix.page }}
          ATTEMPT: ${{ matrix.attempt }}
        run: sleep "$(( (ATTEMPT - 1) * 12 + PAGE ))"
      - name: Fetch an official closing quote page
        run: python tools/fetch_sector_page.py --page ${{ matrix.page }} --attempt ${{ matrix.attempt }} --output-dir sector_pages
      - uses: actions/upload-artifact@v4
        with:
          name: stock-sector-page-${{ matrix.page }}-attempt-${{ matrix.attempt }}
          path: sector_pages/page_${{ matrix.page }}_attempt_${{ matrix.attempt }}.json
          if-no-files-found: error
          retention-days: 3

  aggregate-and-publish:
    needs: [daily_gate, fetch_history, fetch_pages]
    if: always() && !cancelled() && needs.daily_gate.outputs.run_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TARGET: ${{ needs.daily_gate.outputs.expected_trade_day }}
      QUOTES_ONLY: ${{ inputs.quotes_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
            data/sectors
      - uses: actions/download-artifact@v4
        if: needs.daily_gate.outputs.shards != '' && needs.daily_gate.outputs.shards != '[]'
        continue-on-error: true
        with:
          pattern: stock-sector-history-*
          path: sector_history
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.daily_gate.outputs.fetch_quotes == 'true'
        continue-on-error: true
        with:
          pattern: stock-sector-page-*
          path: sector_pages
          merge-multiple: true
      - name: Merge verified records into the current main and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mode=()
          if [ "$QUOTES_ONLY" = true ]; then mode=(--quotes-only); fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m tools.sector_ohlcv publish --target "$TARGET" --page-dir sector_pages "${mode[@]}"
            git add -A data/sectors
            if git diff --cached --quiet; then break; fi
            git commit -m "data: publish verified industry daily bars and closing quotes"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 4 ]; then echo '::error::行业数据发布失败'; exit 1; fi
            sleep "$((attempt * 2))"
          done
      - name: Report and alert on missing industry trading days
        shell: bash
        run: |
          mode=()
          if [ "$QUOTES_ONLY" = true ]; then mode=(--quotes-only); fi
          python -m tools.sector_ohlcv check --target "$TARGET" "${mode[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
