name: A-share industry boards sync

on:
  workflow_dispatch:
    inputs:
      quotes_only:
        description: 'Only update current board quotes (true/false)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force a manual repair even if today was already attempted'
        type: boolean
        required: false
        default: false
  schedule:
    # UTC 09:05 = 北京时间17:05；仅收盘后每天一次，避免重复采集触发上游限流。
    - cron: '5 9 * * 1-5'
  # 主分支代码push不触发行情采集；仅按交易日定时或显式手动请求执行。
  pull_request:
    paths:
      - sector_sync.py
      - tools/sector_daily_gate.py
      - tools/test_sector_sync_safety.py
      - .github/workflows/stock-sector-sync.yml
      - tools/probe_sector_sources.py

permissions:
  contents: write
concurrency:
  group: a-share-industry-boards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax before any market requests
        run: python -m py_compile sector_sync.py tools/github_schedule_trigger.py tools/sector_daily_gate.py
      - name: Run offline rate-limit and freshness regression tests
        run: python -m unittest discover -s tools -p 'test_sector_sync_safety.py' -v
      - name: Probe independent 2026-11-20 sector close source
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python tools/probe_sector_sources.py
  sync:
    needs: syntax-check
    # push和PR只做语法测试；实际抓取只能由每日schedule或明确手动触发启动。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check exchange trading day
        id: calendar
        if: github.event_name == 'schedule'
        run: python tools/github_schedule_trigger.py --check-trading-day
      - name: Check one update per trading day
        id: daily_gate
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        env:
          SECTOR_FORCE_UPDATE: ${{ inputs.force || 'false' }}
        run: |
          git fetch origin main
          git show origin/main:data/sectors/status.json > /tmp/sector_remote_status.json || true
          SECTOR_STATUS_FILE=/tmp/sector_remote_status.json python tools/sector_daily_gate.py
      - uses: actions/setup-python@v5
        if: steps.daily_gate.outputs.run_needed == 'true'
        with:
          python-version: '3.11'
      - name: Install market-data libraries
        if: steps.daily_gate.outputs.run_needed == 'true'
        run: python -m pip install --upgrade 'akshare>=1.16' 'pandas>=2.0'
      - name: Prune unrelated sector files (17 groups + tracked stocks only)
        if: steps.daily_gate.outputs.run_needed == 'true'
        run: python sector_sync.py --prune-only
      - name: Download verified industry quotes / history / constituents
        if: steps.daily_gate.outputs.run_needed == 'true'
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
          MANUAL_QUOTES: ${{ inputs.quotes_only || 'false' }}
        run: |
          set -euo pipefail
          if [ "$MANUAL_QUOTES" = "true" ]; then
            python sector_sync.py --quotes-only
          else
            python sector_sync.py --workers 1 --max-boards 140 --max-members 0
          fi
      - name: Publish only verified industry files (parallel-safe)
        if: steps.daily_gate.outputs.run_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          staging="$(mktemp -d)"
          test -s data/sectors/quotes.json || { echo '::error::缺少已验证的行业快照'; exit 1; }
          cp -a data/sectors/. "$staging/"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/sectors
            # 删除旧历史目录后重新放回白名单文件，确保无关板块在仓库真正删除。
            rm -rf data/sectors/history
            cp -a "$staging/." data/sectors/
            git add -A data/sectors/
            if git diff --cached --quiet; then
              echo '行业数据无变化，不提交。'
              exit 0
            fi
            git commit -m 'data: refresh verified A-share industry boards'
            if git push origin HEAD:main; then
              echo '行业行情已同步到 main/data/sectors/'
              exit 0
            fi
            echo "同步时发生并行写入冲突，重试 $attempt/4"
            sleep "$((attempt * 3))"
          done
          echo '::error::行业行情发布失败（已重试4次）'
          exit 1
      - name: Validate actual completed trading day coverage
        if: steps.daily_gate.outputs.run_needed == 'true'
        # 先安全发布已核验的数据、再判定整轮健康：部分补采可积累，但不能显示绿色成功。
        run: python sector_sync.py --validate-status
