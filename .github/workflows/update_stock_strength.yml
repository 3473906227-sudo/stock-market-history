name: A-share individual stock strength status

on:
  workflow_dispatch:
  schedule:
    # UTC 12:20 = 北京时间20:20，盘后多轮行情同步完成后的兜底刷新。
    - cron: '20 12 * * 1-5'
  workflow_run:
    workflows:
      - Daily stock OHLCV sync
      - Daily A-share market indices sync
      - A-share industry boards sync
    types: [completed]
    branches: [main]
  push:
    paths:
      - tools/update_stock_strength.py
      - .github/workflows/update_stock_strength.yml

permissions:
  contents: write

concurrency:
  group: a-share-individual-stock-strength
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check exchange trading day
        id: calendar
        if: github.event_name == 'schedule'
        run: python tools/github_schedule_trigger.py --check-trading-day
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        with:
          python-version: '3.11'
      - name: Install calculation dependencies
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        run: python -m pip install --upgrade pip && python -m pip install 'pandas>=2.0'
      - name: Calculate actual stock strength from completed daily candles (not forecasts)
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        run: python tools/update_stock_strength.py
      - name: Publish only validated stock strength snapshot (parallel-safe)
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/stock_strength.json || { echo '::error::缺少个股强弱快照'; exit 1; }
          staging="$(mktemp -d)"
          cp data/stock_strength.json "$staging/stock_strength.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$staging/stock_strength.json" data/stock_strength.json
            git add data/stock_strength.json
            if git diff --cached --quiet; then
              echo "个股强弱状态无变化，不需要提交。"
              exit 0
            fi
            git commit -m "data: refresh actual individual stock strength states"
            if git push origin HEAD:main; then
              echo "个股真实行情强弱快照已发布 data/stock_strength.json"
              exit 0
            fi
            echo "其他行情任务并行推送，个股强弱快照重试 $attempt/4"
            sleep "$((attempt * 3))"
          done
          echo "::error::个股强弱快照发布失败（已重试4次）"
          exit 1
