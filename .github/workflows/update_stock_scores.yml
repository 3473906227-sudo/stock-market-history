name: A-share composite research scoring
on:
  workflow_dispatch:
  schedule:
    # UTC 12:45 = 北京时间20:45；每天盘后只运行一次，避免与板块、个股同步争夺东方财富限流额度。
    - cron: '45 12 * * 1-5'
  push:
    paths:
      - tools/update_stock_scores.py
      - .github/workflows/update_stock_scores.yml
      - stock_symbols.txt

permissions:
  contents: write

concurrency:
  group: a-share-composite-research-scores
  cancel-in-progress: false

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify research scoring Python source
        run: python -m py_compile tools/update_stock_scores.py
  score:
    needs: syntax-check
    # 仅A股工作日定时一次或管理员手动触发。代码推送只做语法检查。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check exchange trading day
        id: calendar
        if: github.event_name == 'schedule'
        run: python tools/github_schedule_trigger.py --check-trading-day
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        with:
          python-version: '3.11'
      - name: Install scoring data dependencies
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        run: python -m pip install --upgrade pip && python -m pip install 'akshare>=1.16' 'pandas>=2.0' numpy
      - name: Build verified fundamental, valuation, sector and technical scores
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        run: python tools/update_stock_scores.py
      - name: Publish score snapshot only (parallel-safe)
        if: github.event_name != 'schedule' || steps.calendar.outputs.trading_day == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/scores.json || { echo '::error::缺少综合评分文件'; exit 1; }
          staging="$(mktemp -d)"
          cp data/scores.json "$staging/scores.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$staging/scores.json" data/scores.json
            git add data/scores.json
            if git diff --cached --quiet; then
              echo "综合评分无变化，不需要提交。"
              exit 0
            fi
            git commit -m "data: refresh four-factor stock research scores"
            if git push origin HEAD:main; then
              echo "综合评分快照已发布 data/scores.json"
              exit 0
            fi
            echo "并行数据任务发生推送冲突，重试 $attempt/4"
            sleep "$((attempt * 3))"
          done
          echo "::error::综合评分发布重试失败"
          exit 1
