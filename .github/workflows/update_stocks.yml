name: Daily A-share market indices sync
on:
  workflow_dispatch:
  schedule:
    # 北京时间周一至周五 15:01（UTC 11:25）；非实时，遇节假日保留已有数据
    - cron: '1 7 * * *'
  push:
    paths:
      - tools/update_market_indices.py
      - .github/workflows/update_market_indices.yml
permissions:
  contents: write
# 与已有股票日线同步器串行，避免两项任务同时推送 main 产生冲突
concurrency:
  group: stock-data-sync
  cancel-in-progress: false
jobs:
  index-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install index data dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy akshare yfinance
      - name: Download and validate A-share index candles
        run: python tools/update_market_indices.py
      - name: Commit only validated index history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staging="$(mktemp -d)"
          cp -a indexes/. "$staging/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p indexes
          cp -a "$staging/." indexes/
          git add indexes/
          if ! git diff --cached --quiet; then
            git commit -m "Update validated A-share index data"
            git push origin HEAD:main
          fi
