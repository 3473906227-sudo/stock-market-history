name: Daily stock OHLCV sync
on:
  workflow_dispatch:
  push:
    paths:
      - stock_symbols.txt
      - tools/update_stock_data.py
      - .github/workflows/update_stocks.yml
  schedule:
    # UTC 时区；北京时间 15:13/15:29/16:08/16:41/17:23 多次补跑（工作日）。
    # GitHub schedule 可能大幅延迟；关键时点用外部调度脚本补充触发。
    - cron: '13 7 * * 1-5'
    - cron: '29 7 * * 1-5'
    - cron: '8 8 * * 1-5'
    - cron: '41 8 * * 1-5'
    - cron: '23 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-history-daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-only dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy akshare yfinance
      - name: Download historical daily candles
        run: python tools/update_stock_data.py
      - name: Commit only validated market-data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staging="$(mktemp -d)"
          cp -a data/. "$staging/"
          # 仅发布 data/，且对其它并行数据流的推送冲突自动重试。
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp -a "$staging/." data/
            git add data/
            if git diff --cached --quiet; then
              echo "个股日线没有有效变更，不需要提交。"
              exit 0
            fi
            git commit -m "Update verified daily stock data"
            if git push origin HEAD:main; then
              echo "个股日线发布成功"
              exit 0
            fi
            echo "其他任务并行推送，个股日线重试 $attempt/4"
            sleep "$((attempt * 3))"
          done
          echo "::error::个股行情提交重试失败"
          exit 1
