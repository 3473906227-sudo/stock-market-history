name: Daily stock OHLCV sync
on:
  workflow_dispatch:
  push:
    paths:
      - stock_symbols.txt
      - tools/update_stock_data.py
      - .github/workflows/update_stock_data.yml
  schedule:
    # 北京时间周一至周五 19:00（UTC 11:00），遇假日将保留最近交易日行情
    - cron: '0 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data-only dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy akshare yfinance
      - name: Download historical daily candles
        run: python tools/update_stock_data.py
      - name: Commit only validated market-data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified daily stock data"
            git push
          fi
