name: Daily stock OHLCV sync
on:
  workflow_dispatch:
  push:
    paths:
      - stock_symbols.txt
      - tools/update_stock_data.py
      - .github/workflows/update_stocks.yml
  schedule:
    # 北京时间 15:01 主更新、15:17 补跑、16:10 最终补跑（UTC 07:01/07:17/08:10）；GitHub 定时任务可能延迟或漏触发。
    - cron: '1 7 * * *'
    - cron: '17 7 * * *'
    - cron: '10 8 * * *'
permissions:
  contents: write
concurrency:
  group: stock-market-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-only dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy akshare yfinance
      - name: Download historical daily candles
        run: python tools/update_stock_data.py
      - name: Commit only validated market-data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staging="$(mktemp -d)"
          cp -a data/. "$staging/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp -a "$staging/." data/
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified daily stock data"
            git push origin HEAD:main
          fi
