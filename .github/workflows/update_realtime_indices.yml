name: Intraday A-share index quote relay

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 为 UTC，约北京时间09:02-11:57、13:02-15:57每5分钟目标采集。
    # 避开整5分拥堵；GitHub调度可能延误，需外部触发器保证更强时效。
    - cron: '2-57/5 1-3,5-7 * * 1-5'
  push:
    paths:
      - tools/update_realtime_indices.py
      - tools/github_schedule_trigger.py
      - .github/workflows/update_realtime_indices.yml

permissions:
  contents: write

# Independent from daily historical sync. Push conflicts are handled with fetch/retry below.
concurrency:
  group: intraday-index-quote-relay
  cancel-in-progress: false

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check A-share official trading days
        id: calendar
        run: python tools/github_schedule_trigger.py --check-trading-day
      - name: Set up Python
        if: steps.calendar.outputs.trading_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate current index quotes
        if: steps.calendar.outputs.trading_day == 'true'
        run: python tools/update_realtime_indices.py
      - name: Commit only the validated quote snapshot
        if: steps.calendar.outputs.trading_day == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staging="$(mktemp -d)"
          cp indexes/realtime.json "$staging/realtime.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p indexes
            # 延迟执行的旧任务不能覆盖更晚的实时采集结果。
            if [ -f indexes/realtime.json ] && python -c 'import json,sys; from datetime import datetime; p=lambda path:datetime.fromisoformat(json.load(open(path,encoding="utf-8"))["generated_at"].replace("Z","+00:00"));sys.exit(0 if p(sys.argv[2])>=p(sys.argv[1]) else 1)' "$staging/realtime.json" indexes/realtime.json; then
              echo "远端快照采集时间更新，跳过本次较旧的快照。"
              exit 0
            fi
            cp "$staging/realtime.json" indexes/realtime.json
            git add indexes/realtime.json

            if git diff --cached --quiet; then
              echo "Quote snapshot is unchanged; no commit required."
              exit 0
            fi

            git commit -m "Update intraday A-share index quote snapshot"
            if git push origin HEAD:main; then
              echo "Validated intraday quote snapshot published."
              exit 0
            fi

            echo "Push raced with another data workflow; retrying ($attempt/3)."
            sleep "$((attempt * 2))"
          done

          echo "Could not publish quote snapshot after three attempts."
          exit 1
